name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  cli-spike:
    # Boots a real WordPress Playground instance and asserts what actually
    # installed and activated. Needs network: WordPress core is downloaded from
    # wordpress.org at boot. PHP itself ships in node_modules.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run spike:cli

  execute-spike:
    # Phase 5: boots a real Playground instance, executes a reproduction
    # trigger, and diffs debug.log around it. Needs network, like cli-spike.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run spike:execute

  browser-parity-spike:
    # Phase 5 browser surface: executes the SAME ReproPlan on the CLI and in a
    # real browser and compares the two Verification results. docs/SPEC.md §12
    # forbids assuming one surface from the other, so parity is measured.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the spike page
        run: npx vite --config vite.spike.config.ts &
      - name: Wait for the dev server
        run: npx wait-on http://localhost:9500 --timeout 60000
      - run: npm run spike:parity

  v2-plugins-probe:
    # Measurement, not a gate. On macOS, `run-blueprint` with a Blueprint v2
    # top-level `plugins` array fails with "Error connecting to the SQLite
    # database." while the identical Blueprint works in the browser. This job
    # establishes whether that is platform-specific or general. It reports the
    # outcome and always exits 0 so a known failure does not redden CI.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: v2 WITH plugins (expected to fail on macOS)
        run: |
          set +e
          start=$(date +%s)
          npx wp-playground-cli run-blueprint --blueprint=spike/blueprints/minimal.v2.json > out.txt 2> err.txt
          code=$?
          echo "exit=$code elapsed=$(( $(date +%s) - start ))s"
          echo "--- stdout ---"; cat out.txt
          echo "--- stderr ---"; cat err.txt
          if [ $code -eq 0 ]; then
            echo "VERDICT: v2+plugins SUCCEEDS on Linux -> macOS-specific"
          else
            echo "VERDICT: v2+plugins FAILS on Linux -> general, not platform-specific"
          fi
          exit 0

      - name: v2 WITHOUT plugins (control, succeeds on macOS)
        run: |
          set +e
          printf '{"version":2,"wordpressVersion":"6.8.2","phpVersion":"8.2"}' > /tmp/v2-bare.json
          npx wp-playground-cli run-blueprint --blueprint=/tmp/v2-bare.json > out.txt 2> err.txt
          echo "exit=$? (control)"
          echo "--- stderr ---"; cat err.txt
          exit 0

      - name: v2 with plugins, verified by introspection not exit code
        run: |
          set +e
          npx tsx spike/cli/run.ts --blueprint=spike/blueprints/minimal.v2.json
          echo "introspection exit=$?"
          exit 0

      - name: v1 with installPlugin (control, succeeds on macOS)
        run: |
          set +e
          npx wp-playground-cli run-blueprint --blueprint=spike/blueprints/minimal.v1.json > out.txt 2> err.txt
          echo "exit=$? (control)"
          echo "--- stderr ---"; cat err.txt
          exit 0
